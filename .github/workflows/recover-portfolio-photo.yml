name: Recover portfolio portrait

on:
  push:
    branches:
      - career-audit-2026
    paths:
      - .github/workflows/recover-portfolio-photo.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout old portfolio from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract embedded portrait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          html = Path('index.html').read_text(encoding='utf-8')
          match = re.search(
              r'<div class="about-right">\s*<img src="data:image/[^;]+;base64,([^"]+)" alt="Miguel Ángel Ballesteros"',
              html,
              re.S,
          )
          if not match:
              raise SystemExit('Portrait data URI not found')

          raw = base64.b64decode(match.group(1))
          if raw.startswith(b'\xff\xd8\xff'):
              suffix = '.jpg'
          elif raw.startswith(b'\x89PNG\r\n\x1a\n'):
              suffix = '.png'
          else:
              raise SystemExit(f'Unknown image signature: {raw[:12]!r}')

          out = Path('Miguel_Angel_Ballesteros_portrait_recovered' + suffix)
          out.write_bytes(raw)
          print(f'Recovered {out} ({len(raw)} bytes)')
          PY

      - name: Upload recovered portrait
        uses: actions/upload-artifact@v4
        with:
          name: recovered-portfolio-portrait
          path: Miguel_Angel_Ballesteros_portrait_recovered.*
          if-no-files-found: error
          retention-days: 1
